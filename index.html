<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- helpers ----------
function ymd(d) {
  // local-date formatter, avoids UTC timezone shift bugs
  const dt = (d instanceof Date) ? d : new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function daysSince(ts) {
  if (!ts) return 0;
  const then = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.floor((Date.now() - then.getTime()) / 86400000);
}
function fmtMoney(n) {
  if (n === undefined || n === null || n === '') return '-';
  return Number(n).toLocaleString('en-HK');
}

const STATUS = [
  { v: 1, label: '未覆', color: '#B23A3A' },
  { v: 2, label: '提供咗資料', color: '#C9A24B' },
  { v: 3, label: '已經轉介咗同事', color: '#3C7A5A' },
  { v: 4, label: '失聯', color: '#8A8578' },
  { v: 5, label: '白撞', color: '#8A8578' },
  { v: 6, label: '客戶拒絕', color: '#8A8578' },
];
const statusInfo = (v) => STATUS.find(s => s.v === Number(v)) || STATUS[0];
const CHANNELS = ['Threads', 'WhatsApp', 'Instagram', 'Facebook', '其他'];
const PAYMENT_METHODS = ['ATP', '現金', '支票'];
const REFERRED_SUB_STATUS = [
  { v: '約到時間', color: '#C9A24B' },
  { v: '進行中', color: '#3E5C76' },
  { v: '失聯', color: '#8A8578' },
  { v: '完成', color: '#3C7A5A' },
  { v: '失敗', color: '#B23A3A' },
];
const subStatusColor = (v) => (REFERRED_SUB_STATUS.find(s => s.v === v) || {}).color || '#8A8578';

const emptyForm = {
  date: ymd(new Date()),
  name: '',
  channel: 'Threads',
  threadsId: '',
  hkid: '',
  phone: '',
  debtContent: '',
  tuGrade: '',
  line1Count: '',
  line1Total: '',
  line2Count: '',
  line2Total: '',
  hasDefaulted: '冇',
  hasLitigation: '冇',
  monthlyIncome: '',
  paymentMethod: 'ATP',
  hasMPF: '有',
  status: 1,
  referredColleague: '',
  code: '',
  referredSubStatus: '約到時間',
  notes: '',
};

function getNextCode(colleague, entries, excludeId) {
  const used = entries
    .filter(e => e.id !== excludeId && e.referredColleague === colleague && e.code)
    .map(e => parseInt(e.code, 10))
    .filter(n => !isNaN(n));
  const next = used.length ? Math.max(...used) + 1 : 1;
  return String(next).padStart(2, '0');
}

function parseTable(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length === 0) return { headers: [], rows: [] };
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(delim).map(h => h.trim());
  const rows = lines.slice(1).map(l => l.split(delim).map(c => c.trim()));
  return { headers, rows };
}

function parseDateFlexible(str, assumedYear) {
  if (!str) return '';
  str = str.trim();
  let m = str.match(/(\d{1,2})月(\d{1,2})日/);
  if (m) return `${assumedYear}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const d = new Date(str);
  if (!isNaN(d.getTime())) return ymd(d);
  return '';
}

function guessFieldMap(headers) {
  const find = (...keys) => headers.findIndex(h => keys.some(k => h.includes(k)));
  return {
    date: find('日期'),
    name: find('姓名', '客戶'),
    phone: find('電話'),
    hkid: find('HKID', '身份證'),
    debtContent: find('內容', '負債', '債務'),
    status: find('狀態'),
    referredColleague: find('轉介同事', '跟進同事', '同事'),
    channel: find('來源', '邊個廣告', '渠道', 'wts', 'fb', 'ig'),
    notes: find('備注', '備註', '最後'),
  };
}

function guessStatusTarget(v) {
  const s = (v || '').trim();
  if (!s) return 1;
  if (s.includes('白撞')) return 5;
  if (s.includes('拒絕')) return 6;
  if (s.includes('失聯')) return 4;
  if (s.includes('轉介')) return 3;
  if (s.includes('拎料') || s.includes('有興趣') || s.includes('提供')) return 2;
  if (s.includes('未覆')) return 1;
  return 1;
}

// ---------- Login ----------
function Login({ onLoggedIn }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      const email = `${username.trim().toLowerCase()}@debt-professor.local`;
      await window.FB.signInWithEmailAndPassword(window.FB.auth, email, password);
    } catch (e2) {
      setErr('登入失敗，請檢查用戶名同密碼');
    } finally { setBusy(false); }
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <form onSubmit={submit} style={{width:320}} className="bg-white p-8 rounded-lg shadow-sm border border-[#E7E1D2]">
        <div className="text-center mb-6">
          <div style={{fontSize:20,fontWeight:700,color:'var(--navy)'}}>債務教授</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>查詢管理系統</div>
        </div>
        <input value={username} onChange={e=>setUsername(e.target.value)} placeholder="用戶名"
          className="w-full mb-3 px-3 py-2 border border-[#D8D2C4] rounded text-sm" />
        <input value={password} onChange={e=>setPassword(e.target.value)} type="password" placeholder="密碼"
          className="w-full mb-4 px-3 py-2 border border-[#D8D2C4] rounded text-sm" />
        {err && <div style={{color:'var(--alert)',fontSize:12,marginBottom:12}}>{err}</div>}
        <button disabled={busy} type="submit"
          style={{background:'var(--navy)'}}
          className="w-full text-white py-2 rounded text-sm font-medium disabled:opacity-50">
          {busy ? '登入緊…' : '登入'}
        </button>
      </form>
    </div>
  );
}

// ---------- Status badge ----------
function StatusBadge({ status }) {
  const s = statusInfo(status);
  return <span className="badge" style={{background:s.color}}>{s.label}</span>;
}

// ---------- Entry Form Modal ----------
// Defined at module scope (not inside EntryModal) — redefining a component
// inline on every render gives it a new identity, which makes React
// unmount/remount its children (losing input focus / closing the keyboard
// after every keystroke). Keeping it stable here fixes that.
function Field({ label, children }) {
  return (
    <div className="mb-3">
      <label className="block text-xs mb-1" style={{color:'var(--muted)'}}>{label}</label>
      {children}
    </div>
  );
}
const inputCls = "w-full px-2 py-1.5 border border-[#D8D2C4] rounded text-sm box-border";

function EntryModal({ initial, colleagues, entries, readOnly, onClose, onSave, onAddColleague }) {
  const [form, setForm] = useState(initial ? { ...emptyForm, ...initial } : { ...emptyForm });
  const [newColleague, setNewColleague] = useState('');
  const [showNewColleague, setShowNewColleague] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  // auto-suggest code when colleague chosen & status = referred, only if code currently blank
  useEffect(() => {
    if (Number(form.status) === 3 && form.referredColleague && !form.code) {
      set('code', getNextCode(form.referredColleague, entries, form.id));
    }
  }, [form.status, form.referredColleague]);

  const handleColleagueChange = (val) => {
    if (val === '__new__') { setShowNewColleague(true); return; }
    set('referredColleague', val);
  };
  const confirmNewColleague = () => {
    const name = newColleague.trim();
    if (!name) return;
    onAddColleague(name);
    set('referredColleague', name);
    setNewColleague('');
    setShowNewColleague(false);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) { alert('請輸入姓名'); return; }
    onSave(form);
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(22,36,63,0.4)',zIndex:50,display:'flex',alignItems:'flex-start',justifyContent:'center',overflowY:'auto',padding:'24px 12px'}}>
      <form onSubmit={submit} className="bg-white rounded-lg shadow-lg w-full" style={{maxWidth:640}}>
        <div className="px-5 py-4 border-b border-[#EDE8DA] flex items-center justify-between">
          <div className="font-semibold text-[var(--navy)]">{readOnly ? '查看查詢' : form.id ? '編輯查詢' : '新增查詢'}</div>
          <button type="button" onClick={onClose} className="text-[var(--muted)] text-xl leading-none">&times;</button>
        </div>
        <fieldset disabled={readOnly} style={{border:'none',padding:0,margin:0}}>
        <div className="px-5 py-4" style={{maxHeight:'70vh',overflowY:'auto'}}>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
            <Field label="查詢日期">
              <input type="date" className={inputCls} value={form.date} onChange={e=>set('date', e.target.value)} />
            </Field>
            <Field label="查詢渠道">
              <select className={inputCls} value={form.channel} onChange={e=>set('channel', e.target.value)}>
                {CHANNELS.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="姓名">
              <input className={inputCls} value={form.name} onChange={e=>set('name', e.target.value)} />
            </Field>
            <Field label="Threads ID">
              <input className={inputCls} value={form.threadsId} onChange={e=>set('threadsId', e.target.value)} />
            </Field>
            <Field label="HKID 身份證號碼">
              <input className={inputCls} value={form.hkid} onChange={e=>set('hkid', e.target.value)} />
            </Field>
            <Field label="電話號碼">
              <input className={inputCls} value={form.phone} onChange={e=>set('phone', e.target.value)} />
            </Field>
          </div>

          <Field label="債務內容">
            <textarea className={inputCls} rows={2} value={form.debtContent} onChange={e=>set('debtContent', e.target.value)} />
          </Field>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
            <Field label="TU Grade">
              <input className={inputCls} value={form.tuGrade} onChange={e=>set('tuGrade', e.target.value)} />
            </Field>
            <Field label="有冇被起訴">
              <select className={inputCls} value={form.hasLitigation} onChange={e=>set('hasLitigation', e.target.value)}>
                <option>有</option><option>冇</option>
              </select>
            </Field>
            <Field label="一線公司數目">
              <input type="number" className={inputCls} value={form.line1Count} onChange={e=>set('line1Count', e.target.value)} />
            </Field>
            <Field label="一線總欠款 (HKD)">
              <input type="number" className={inputCls} value={form.line1Total} onChange={e=>set('line1Total', e.target.value)} />
            </Field>
            <Field label="二線公司數目">
              <input type="number" className={inputCls} value={form.line2Count} onChange={e=>set('line2Count', e.target.value)} />
            </Field>
            <Field label="二線總欠款 (HKD)">
              <input type="number" className={inputCls} value={form.line2Total} onChange={e=>set('line2Total', e.target.value)} />
            </Field>
            <Field label="有冇走過數">
              <select className={inputCls} value={form.hasDefaulted} onChange={e=>set('hasDefaulted', e.target.value)}>
                <option>有</option><option>冇</option>
              </select>
            </Field>
            <Field label="月入 (HKD)">
              <input type="number" className={inputCls} value={form.monthlyIncome} onChange={e=>set('monthlyIncome', e.target.value)} />
            </Field>
            <Field label="出糧方式">
              <select className={inputCls} value={form.paymentMethod} onChange={e=>set('paymentMethod', e.target.value)}>
                {PAYMENT_METHODS.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="有冇MPF">
              <select className={inputCls} value={form.hasMPF} onChange={e=>set('hasMPF', e.target.value)}>
                <option>有</option><option>冇</option>
              </select>
            </Field>
          </div>

          <Field label="進度">
            <select className={inputCls} value={form.status} onChange={e=>set('status', Number(e.target.value))}>
              {STATUS.map(s=><option key={s.v} value={s.v}>{s.v}. {s.label}</option>)}
            </select>
          </Field>

          {Number(form.status) === 3 && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 p-3 rounded" style={{background:'#F6F4EF',border:'1px solid #EDE8DA'}}>
              <Field label="轉介同事">
                {!showNewColleague ? (
                  <select className={inputCls} value={form.referredColleague} onChange={e=>handleColleagueChange(e.target.value)}>
                    <option value="">請選擇…</option>
                    {colleagues.map(c=><option key={c} value={c}>{c}</option>)}
                    <option value="__new__">+ 新增同事…</option>
                  </select>
                ) : (
                  <div className="flex gap-1">
                    <input className={inputCls} placeholder="同事名" value={newColleague} onChange={e=>setNewColleague(e.target.value)} />
                    <button type="button" onClick={confirmNewColleague} style={{background:'var(--navy)'}} className="text-white text-xs px-2 rounded">加</button>
                  </div>
                )}
              </Field>
              <Field label="編號 (自動排，可自行修改)">
                <input className={inputCls} value={form.code} onChange={e=>set('code', e.target.value)} />
              </Field>
              <Field label="轉介後進度">
                <select className={inputCls} value={form.referredSubStatus} onChange={e=>set('referredSubStatus', e.target.value)}>
                  {REFERRED_SUB_STATUS.map(s=><option key={s.v} value={s.v}>{s.v}</option>)}
                </select>
              </Field>
            </div>
          )}

          <Field label="跟進備注">
            <textarea className={inputCls} rows={3} value={form.notes} onChange={e=>set('notes', e.target.value)} />
          </Field>
        </div>
        </fieldset>
        <div className="px-5 py-3 border-t border-[#EDE8DA] flex justify-end gap-2">
          <button type="button" onClick={onClose} className="px-4 py-2 text-sm rounded border border-[#D8D2C4]">{readOnly ? '關閉' : '取消'}</button>
          {!readOnly && (
            <button type="submit" style={{background:'var(--navy)'}} className="px-4 py-2 text-sm rounded text-white">儲存</button>
          )}
        </div>
      </form>
    </div>
  );
}

// ---------- Dashboard tab (follow-up reminders) ----------
function Dashboard({ entries, onOpen }) {
  const pending = entries
    .filter(e => Number(e.status) !== 3)
    .map(e => ({ ...e, _days: daysSince(e.statusUpdatedAt) }))
    .sort((a, b) => b._days - a._days);

  const urgent = pending.filter(e => e._days >= 2);
  const rest = pending.filter(e => e._days < 2);

  const Row = ({ e, urgentRow }) => (
    <tr onClick={()=>onOpen(e)} className="cursor-pointer hover:bg-[#F6F4EF]">
      <td className="px-3 py-2 text-sm">{e.name}</td>
      <td className="px-3 py-2 text-sm">{e.date}</td>
      <td className="px-3 py-2"><StatusBadge status={e.status} /></td>
      <td className="px-3 py-2 text-sm" style={{color: urgentRow ? 'var(--alert)' : 'var(--muted)', fontWeight: urgentRow?600:400}}>
        {e._days} 日未跟進
      </td>
      <td className="px-3 py-2 text-sm">{e.phone}</td>
    </tr>
  );

  return (
    <div>
      <div className="mb-6">
        <div className="text-sm font-semibold mb-2" style={{color:'var(--alert)'}}>
          ⚠ 待跟進提醒（未轉介 · 超過2日未更新，共 {urgent.length} 位）
        </div>
        <div className="bg-white rounded border border-[#EDE8DA] overflow-hidden">
          <table className="w-full">
            <tbody>
              {urgent.length === 0 && <tr><td className="px-3 py-4 text-sm text-[var(--muted)]">暫時冇需要緊急跟進嘅個案</td></tr>}
              {urgent.map(e => <Row key={e.id} e={e} urgentRow />)}
            </tbody>
          </table>
        </div>
      </div>

      <div>
        <div className="text-sm font-semibold mb-2" style={{color:'var(--navy)'}}>其他未轉介個案</div>
        <div className="bg-white rounded border border-[#EDE8DA] overflow-hidden">
          <table className="w-full">
            <tbody>
              {rest.length === 0 && <tr><td className="px-3 py-4 text-sm text-[var(--muted)]">冇其他個案</td></tr>}
              {rest.map(e => <Row key={e.id} e={e} />)}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------- All entries tab ----------
function AllEntries({ entries, onOpen, onDelete, canDelete }) {
  const [search, setSearch] = useState('');
  const filtered = entries.filter(e => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return [e.name, e.phone, e.hkid, e.threadsId].some(v => (v||'').toLowerCase().includes(q));
  }).sort((a,b) => (b.date||'').localeCompare(a.date||''));

  return (
    <div>
      <input placeholder="搜尋姓名 / 電話 / HKID / Threads ID" value={search} onChange={e=>setSearch(e.target.value)}
        className="w-full mb-3 px-3 py-2 border border-[#D8D2C4] rounded text-sm bg-white" />
      <div className="bg-white rounded border border-[#EDE8DA] overflow-x-auto">
        <table className="w-full">
          <thead>
            <tr className="text-left text-xs" style={{color:'var(--muted)',borderBottom:'1px solid #EDE8DA'}}>
              <th className="px-3 py-2">日期</th>
              <th className="px-3 py-2">姓名</th>

// ---------- Referred tab, grouped by colleague, code editable ----------
function ReferredList({ entries, onUpdateCode, onUpdateSubStatus, onOpen, readOnly }) {
  const referred = entries.filter(e => Number(e.status) === 3);

  referred.forEach(e => {

  return (

                  <th className="px-3 py-2">姓名</th>
                  <th className="px-3 py-2">電話</th>
                  <th className="px-3 py-2">日期</th>

                  </tr>

            </table>
          </div>
        </div>

// ---------- Stats tab ----------
function StatBox({ label, value, color }) {
  return (
    <div className="bg-white rounded border border-[#EDE8DA] p-4">
      <div className="text-xs mb-1" style={{color:'var(--muted)'}}>{label}</div>
      <div className="text-2xl font-semibold" style={{color: color || 'var(--navy)'}}>{value}</div>
    </div>
  );
}
function BarRow({ label, count, total, color }) {
  const pct = total ? Math.round((count/total)*100) : 0;
  return (
    <div className="mb-2">
      <div className="flex justify-between text-xs mb-1">
        <span style={{color:'var(--navy)'}}>{label}</span>
        <span style={{color:'var(--muted)'}}>{count}（{pct}%）</span>
      </div>
      <div style={{background:'#EDE8DA',borderRadius:4,height:8}}>
        <div style={{width:`${pct}%`,background:color,height:8,borderRadius:4}}></div>
      </div>
    </div>
  );
}
function StatsPanel({ entries }) {
  const total = entries.length;
  const referred = entries.filter(e => Number(e.status) === 3);
  const referredCount = referred.length;

  const byStatus = STATUS.map(s => ({
    ...s,
    count: entries.filter(e => Number(e.status) === s.v).length
  }));

  const bySub = REFERRED_SUB_STATUS.map(s => ({
    ...s,
    count: referred.filter(e => (e.referredSubStatus || '約到時間') === s.v).length
  }));

  const byColleague = {};
  referred.forEach(e => {
    const k = e.referredColleague || '(未指定)';
    byColleague[k] = (byColleague[k] || 0) + 1;
  });

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <StatBox label="總查詢數" value={total} />
        <StatBox label="已轉介數" value={referredCount} color="var(--ok)" />
        <StatBox label="轉介完成" value={referred.filter(e=>e.referredSubStatus==='完成').length} color="var(--ok)" />
        <StatBox label="轉介失敗" value={referred.filter(e=>e.referredSubStatus==='失敗').length} color="var(--alert)" />
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        <div className="bg-white rounded border border-[#EDE8DA] p-4">
          <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>查詢進度分佈</div>
          {byStatus.map(s => <BarRow key={s.v} label={s.label} count={s.count} total={total} color={s.color} />)}
        </div>

        <div className="bg-white rounded border border-[#EDE8DA] p-4">
          <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>轉介後進度分佈（共 {referredCount} 個）</div>
          {referredCount === 0 && <div className="text-xs text-[var(--muted)]">暫時未有已轉介個案</div>}
          {bySub.map(s => <BarRow key={s.v} label={s.v} count={s.count} total={referredCount} color={s.color} />)}
        </div>
      </div>

      <div className="bg-white rounded border border-[#EDE8DA] p-4 mt-6">
        <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>按同事分佈</div>
        {Object.keys(byColleague).length === 0 && <div className="text-xs text-[var(--muted)]">暫時未有轉介紀錄</div>}
        {Object.entries(byColleague).sort((a,b)=>b[1]-a[1]).map(([name,count]) => (
          <BarRow key={name} label={name} count={count} total={referredCount} color="var(--slate)" />
        ))}
      </div>
    </div>
  );
}

// ---------- Accounts management (admin only) ----------
function AccountsPanel({ db }) {
  const [users, setUsers] = useState([]);
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [role, setRole] = useState('viewer');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    const { collection, onSnapshot } = window.FB;
    const unsub = onSnapshot(collection(db, 'users'), snap => {
      setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  const createAccount = async (e) => {
    e.preventDefault();
    setMsg('');
    if (!username.trim() || !password.trim() || !name.trim()) {
      setMsg('請填晒用戶名、密碼同姓名');
      return;
    }
    if (password.length < 6) {
      setMsg('密碼要至少6個字');
      return;
    }
    setBusy(true);
    try {
      const { secondaryAuth, createUserWithEmailAndPassword, signOut, doc, setDoc } = window.FB;
      const email = `${username.trim().toLowerCase()}@debt-professor.local`;
      // Use the secondary auth instance so this doesn't sign the admin out
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      const uid = cred.user.uid;
      await signOut(secondaryAuth);
      await setDoc(doc(db, 'users', uid), { role, name: name.trim(), username: username.trim().toLowerCase() });
      setMsg(`已建立帳戶：${username}（${role === 'viewer' ? '唯讀' : role === 'staff' ? '職員' : '管理員'}）`);
      setUsername(''); setPassword(''); setName(''); setRole('viewer');
    } catch (err) {
      setMsg('建立失敗：' + (err.message || '未知錯誤'));
    } finally {
      setBusy(false);
    }
  };

  const roleLabel = (r) => r === 'admin' ? '管理員' : r === 'staff' ? '職員' : '唯讀';

  return (
    <div>
      <div className="bg-white rounded border border-[#EDE8DA] p-4 mb-6 max-w-md">
        <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>新增帳戶</div>
        <form onSubmit={createAccount}>
          <div className="mb-3">
            <label className="block text-xs mb-1" style={{color:'var(--muted)'}}>用戶名（登入用，唔使打@後面）</label>
            <input className="px-2 py-1.5 border border-[#D8D2C4] rounded text-sm" value={username} onChange={e=>setUsername(e.target.value)} />
          </div>
          <div className="mb-3">
            <label className="block text-xs mb-1" style={{color:'var(--muted)'}}>密碼（至少6個字）</label>
            <input type="password" className="px-2 py-1.5 border border-[#D8D2C4] rounded text-sm" value={password} onChange={e=>setPassword(e.target.value)} />
          </div>
          <div className="mb-3">
            <label className="block text-xs mb-1" style={{color:'var(--muted)'}}>顯示姓名</label>
            <input className="px-2 py-1.5 border border-[#D8D2C4] rounded text-sm" value={name} onChange={e=>setName(e.target.value)} />
          </div>
          <div className="mb-3">
            <label className="block text-xs mb-1" style={{color:'var(--muted)'}}>角色</label>
            <select className="px-2 py-1.5 border border-[#D8D2C4] rounded text-sm" value={role} onChange={e=>setRole(e.target.value)}>
              <option value="viewer">唯讀</option>
              <option value="staff">職員</option>
              <option value="admin">管理員</option>
            </select>
          </div>
          {msg && <div className="text-xs mb-3" style={{color: msg.startsWith('已建立') ? 'var(--ok)' : 'var(--alert)'}}>{msg}</div>}
          <button disabled={busy} type="submit" style={{background:'var(--navy)'}} className="text-white text-sm px-4 py-2 rounded disabled:opacity-50">
            {busy ? '建立緊…' : '建立帳戶'}
          </button>
        </form>
      </div>

      <div className="bg-white rounded border border-[#EDE8DA] overflow-hidden max-w-md">
        <div className="px-4 py-2 text-sm font-semibold" style={{color:'var(--navy)',borderBottom:'1px solid #EDE8DA'}}>現有帳戶</div>
        <table className="w-full">
          <tbody>
            {users.map(u => (
              <tr key={u.id} style={{borderBottom:'1px solid #F2EEE2'}}>
                <td className="px-4 py-2 text-sm">{u.name || '-'}</td>
                <td className="px-4 py-2 text-xs" style={{color:'var(--muted)'}}>{u.username ? `${u.username}@debt-professor.local` : u.id}</td>
                <td className="px-4 py-2 text-xs"><span className="badge" style={{background:'var(--slate)'}}>{roleLabel(u.role)}</span></td>
              </tr>
            ))}
            {users.length === 0 && <tr><td className="px-4 py-3 text-sm text-[var(--muted)]">未有帳戶紀錄</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------- Import from pasted spreadsheet data ----------
const APP_FIELDS = [
  { key: 'date', label: '查詢日期', required: true },
  { key: 'name', label: '客戶姓名', required: true },
  { key: 'phone', label: '電話號碼' },
  { key: 'hkid', label: 'HKID' },
  { key: 'debtContent', label: '債務內容' },
  { key: 'status', label: '狀態' },
  { key: 'referredColleague', label: '轉介同事' },
  { key: 'channel', label: '來源/渠道' },
  { key: 'notes', label: '備注' },
];

function ImportPanel({ entries, colleagues, db, onAddColleague }) {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [fieldMap, setFieldMap] = useState({});
  const [statusMap, setStatusMap] = useState({});
  const [assumedYear, setAssumedYear] = useState(new Date().getFullYear());
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState('');

  const doParse = () => {
    const p = parseTable(rawText);
    if (p.headers.length === 0) { alert('冇解析到任何資料，check吓有冇貼咗嘢'); return; }
    setParsed(p);
    setFieldMap(guessFieldMap(p.headers));
    setResult('');
  };

  const statusValues = useMemo(() => {
    if (!parsed || fieldMap.status === undefined || fieldMap.status < 0) return [];
    const set = new Set(parsed.rows.map(r => (r[fieldMap.status] || '').trim()).filter(Boolean));
    return [...set];
  }, [parsed, fieldMap.status]);

  useEffect(() => {
    if (statusValues.length) {
      const m = {};
      statusValues.forEach(v => { m[v] = guessStatusTarget(v); });
      setStatusMap(m);
    }
  }, [statusValues.join('|')]);

  const buildRow = (r) => {
    const get = (key) => (fieldMap[key] >= 0 ? (r[fieldMap[key]] || '').trim() : '');
    const statusRaw = get('status');
    const status = statusRaw ? (statusMap[statusRaw] ?? guessStatusTarget(statusRaw)) : 1;
    const colleague = get('referredColleague');
    return {
      date: parseDateFlexible(get('date'), assumedYear) || ymd(new Date()),
      name: get('name'),
      phone: get('phone'),
      hkid: get('hkid'),
      debtContent: get('debtContent'),
      channel: get('channel') || '其他',
      status: colleague ? 3 : status,
      referredColleague: colleague || '',
      notes: get('notes'),
      threadsId: '', tuGrade: '', line1Count: '', line1Total: '', line2Count: '', line2Total: '',
      hasDefaulted: '冇', hasLitigation: '冇', monthlyIncome: '', paymentMethod: 'ATP', hasMPF: '有',
      code: '',
    };
  };

  const previewRows = parsed ? parsed.rows.filter(r => (fieldMap.name >= 0 && r[fieldMap.name])).map(buildRow) : [];

  const runImport = async () => {
    if (!previewRows.length) return;
    setBusy(true);
    setResult('');
    try {
      const { writeBatch, doc, collection, serverTimestamp, setDoc } = window.FB;
      // ensure colleague docs exist
      const neededColleagues = [...new Set(previewRows.map(r => r.referredColleague).filter(Boolean))];
      for (const c of neededColleagues) {
        if (!colleagues.includes(c)) await onAddColleague(c);
      }
      // running per-colleague code counters, continuing from existing max
      const counters = {};
      const codeFor = (colleague) => {
        if (!colleague) return '';
        if (counters[colleague] === undefined) {
          const used = entries.filter(e => e.referredColleague === colleague && e.code)
            .map(e => parseInt(e.code, 10)).filter(n => !isNaN(n));
          counters[colleague] = used.length ? Math.max(...used) : 0;
        }
        counters[colleague] += 1;
        return String(counters[colleague]).padStart(2, '0');
      };

      let count = 0;
      const chunkSize = 400;
      for (let i = 0; i < previewRows.length; i += chunkSize) {
        const chunk = previewRows.slice(i, i + chunkSize);
        const batch = writeBatch(db);
        chunk.forEach(row => {
          const ref = doc(collection(db, 'inquiries'));
          const payload = { ...row };
          if (payload.status === 3) payload.code = codeFor(payload.referredColleague);
          payload.createdAt = serverTimestamp();
          payload.updatedAt = serverTimestamp();
          payload.statusUpdatedAt = serverTimestamp();
          batch.set(ref, payload);
          count++;
        });
        await batch.commit();
      }
      setResult(`匯入完成，共 ${count} 筆`);
      setRawText(''); setParsed(null);
    } catch (err) {
      setResult('匯入失敗：' + (err.message || '未知錯誤'));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div>
      <div className="bg-white rounded border border-[#EDE8DA] p-4 mb-4">
        <div className="text-sm font-semibold mb-2" style={{color:'var(--navy)'}}>1. 貼上資料</div>
        <div className="text-xs mb-2" style={{color:'var(--muted)'}}>
          喺 Google Sheets 揀晒你要匯入嘅範圍（連標題row）→ 複製 → 貼落呢度
        </div>
        <textarea rows={6} className="px-2 py-1.5 border border-[#D8D2C4] rounded text-xs font-mono"
          value={rawText} onChange={e=>setRawText(e.target.value)} placeholder="貼上你複製嘅表格內容…" />
        <div className="flex items-center gap-3 mt-2">
          <button onClick={doParse} style={{background:'var(--navy)'}} className="text-white text-sm px-4 py-2 rounded">解析</button>
          <div className="text-xs" style={{color:'var(--muted)'}}>
            日期無年份時假設係： 
            <input type="number" className="inline-block w-20 px-1 py-0.5 border border-[#D8D2C4] rounded ml-1" value={assumedYear} onChange={e=>setAssumedYear(Number(e.target.value))} />
          </div>
        </div>
      </div>

      {parsed && (
        <>
          <div className="bg-white rounded border border-[#EDE8DA] p-4 mb-4">
            <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>2. 對應欄位</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
              {APP_FIELDS.map(f => (
                <div key={f.key} className="mb-2">
                  <label className="block text-xs mb-1" style={{color:'var(--muted)'}}>{f.label}{f.required ? ' *' : ''}</label>
                  <select className="px-2 py-1.5 border border-[#D8D2C4] rounded text-sm"
                    value={fieldMap[f.key] ?? -1}
                    onChange={e=>setFieldMap(m=>({...m, [f.key]: Number(e.target.value)}))}>
                    <option value={-1}>（不匯入）</option>
                    {parsed.headers.map((h, idx) => <option key={idx} value={idx}>{h || `欄位${idx+1}`}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </div>

          {statusValues.length > 0 && (
            <div className="bg-white rounded border border-[#EDE8DA] p-4 mb-4">
              <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>3. 對應狀態</div>
              {statusValues.map(v => (
                <div key={v} className="flex items-center gap-3 mb-2">
                  <span className="text-sm w-28">{v}</span>
                  <span style={{color:'var(--muted)'}}>→</span>
                  <select className="px-2 py-1 border border-[#D8D2C4] rounded text-sm"
                    value={statusMap[v] ?? guessStatusTarget(v)}
                    onChange={e=>setStatusMap(m=>({...m, [v]: Number(e.target.value)}))}>
                    {STATUS.map(s => <option key={s.v} value={s.v}>{s.v}. {s.label}</option>)}
                  </select>
                </div>
              ))}
              <div className="text-xs mt-1" style={{color:'var(--muted)'}}>* 如果「轉介同事」欄有值，無論狀態揀咩都會自動當「已經轉介咗同事」</div>
            </div>
          )}

          <div className="bg-white rounded border border-[#EDE8DA] p-4 mb-4 overflow-x-auto">
            <div className="text-sm font-semibold mb-3" style={{color:'var(--navy)'}}>4. 預覽（共 {previewRows.length} 筆，顯示頭5筆）</div>
            <table className="w-full">
              <thead>
                <tr className="text-left text-xs" style={{color:'var(--muted)'}}>
                  <th className="px-2 py-1">日期</th><th className="px-2 py-1">姓名</th><th className="px-2 py-1">電話</th>
                  <th className="px-2 py-1">狀態</th><th className="px-2 py-1">轉介同事</th>
                </tr>
              </thead>
              <tbody>
                {previewRows.slice(0,5).map((r, i) => (
                  <tr key={i} style={{borderTop:'1px solid #F2EEE2'}}>
                    <td className="px-2 py-1 text-sm">{r.date}</td>
                    <td className="px-2 py-1 text-sm">{r.name}</td>
                    <td className="px-2 py-1 text-sm">{r.phone}</td>
                    <td className="px-2 py-1"><StatusBadge status={r.status} /></td>
                    <td className="px-2 py-1 text-sm">{r.referredColleague || '-'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {result && <div className="text-sm mb-3" style={{color: result.startsWith('匯入完成') ? 'var(--ok)' : 'var(--alert)'}}>{result}</div>}

          <button disabled={busy || !previewRows.length} onClick={runImport}
            style={{background:'var(--gold)'}} className="text-white text-sm px-5 py-2 rounded font-medium disabled:opacity-50">
            {busy ? '匯入緊…' : `開始匯入（${previewRows.length}筆）`}
          </button>
        </>
      )}
    </div>
  );
}

// ---------- Main App ----------
function MainApp({ user, role, displayName }) {
  const isViewer = role === 'viewer';
  const isAdmin = role === 'admin';
  const [tab, setTab] = useState('dashboard');
  const [entries, setEntries] = useState([]);
  const [colleagues, setColleagues] = useState([]);
  const [modalEntry, setModalEntry] = useState(null);
  const [showModal, setShowModal] = useState(false);

  useEffect(() => {
    const { db, collection, query, orderBy, onSnapshot } = window.FB;
    const q1 = query(collection(db, 'inquiries'), orderBy('date', 'desc'));
    const unsub1 = onSnapshot(q1, snap => {
      setEntries(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    const unsub2 = onSnapshot(collection(db, 'colleagues'), snap => {
      setColleagues(snap.docs.map(d => d.data().name).sort());
    });
    return () => { unsub1(); unsub2(); };
  }, []);

  const openNew = () => { setModalEntry(null); setShowModal(true); };
  const openEdit = (e) => { setModalEntry(e); setShowModal(true); };

  const save = async (form) => {
    const { db, collection, doc, addDoc, setDoc, updateDoc, serverTimestamp } = window.FB;
    const prev = modalEntry;
    const statusChanged = !prev || Number(prev.status) !== Number(form.status);
    const payload = { ...form };
    delete payload.id;
    if (statusChanged) payload.statusUpdatedAt = serverTimestamp();
    payload.updatedAt = serverTimestamp();

    if (form.id) {
      await updateDoc(doc(db, 'inquiries', form.id), payload);
    } else {
      payload.createdAt = serverTimestamp();
      payload.statusUpdatedAt = serverTimestamp();
      await addDoc(collection(db, 'inquiries'), payload);
    }
    setShowModal(false);
  };

  const remove = async (e) => {
    if (!confirm(`確定刪除 ${e.name} 嘅紀錄？`)) return;
    const { db, doc, deleteDoc } = window.FB;
    await deleteDoc(doc(db, 'inquiries', e.id));
  };

  const addColleague = async (name) => {
    if (colleagues.includes(name)) return;
    const { db, doc, setDoc } = window.FB;
    await setDoc(doc(db, 'colleagues', name), { name });
  };

  const updateCode = async (entry, newCode) => {
    if (newCode === entry.code) return;
    const { db, doc, updateDoc } = window.FB;
    await updateDoc(doc(db, 'inquiries', entry.id), { code: newCode });
  };

  const updateSubStatus = async (entry, newSub) => {
    if (newSub === entry.referredSubStatus) return;
    const { db, doc, updateDoc } = window.FB;
    await updateDoc(doc(db, 'inquiries', entry.id), { referredSubStatus: newSub });
  };

  const logout = () => window.FB.signOut(window.FB.auth);

  const urgentCount = entries.filter(e => Number(e.status) !== 3 && daysSince(e.statusUpdatedAt) >= 2).length;

  const TabBtn = ({ id, label, badge }) => (
    <button onClick={()=>setTab(id)}
      className="px-4 py-2 text-sm rounded-t"
      style={{
        background: tab===id ? '#fff' : 'transparent',
        color: tab===id ? 'var(--navy)' : 'var(--muted)',
        fontWeight: tab===id ? 600 : 400,
        borderBottom: tab===id ? '2px solid var(--gold)' : '2px solid transparent'
      }}>
      {label}{badge ? <span className="ml-1 badge" style={{background:'var(--alert)'}}>{badge}</span> : null}
    </button>
  );

  return (
    <div style={{minHeight:'100vh'}}>
      <div style={{background:'var(--navy)'}} className="text-white px-5 py-3 flex items-center justify-between">
        <div className="font-semibold">債務教授 · 查詢管理系統</div>
        <div className="flex items-center gap-3 text-sm">
          <span style={{opacity:0.8}}>{displayName || user.email.split('@')[0]}</span>
          <span className="badge" style={{background:'var(--gold)'}}>{isViewer ? '唯讀' : isAdmin ? '管理員' : '職員'}</span>
          <button onClick={logout} className="underline">登出</button>
        </div>
      </div>

      <div className="px-5 pt-3 flex items-center justify-between" style={{borderBottom:'1px solid #EDE8DA'}}>
        <div className="flex gap-1">
          <TabBtn id="dashboard" label="待跟進" badge={urgentCount || null} />
          <TabBtn id="all" label="全部查詢" />
          <TabBtn id="referred" label="已轉介列表" />
          <TabBtn id="stats" label="統計報表" />
          {!isViewer && <TabBtn id="import" label="資料匯入" />}
          {isAdmin && <TabBtn id="accounts" label="帳戶管理" />}
        </div>
        {!isViewer && (
          <button onClick={openNew} style={{background:'var(--gold)'}} className="mb-2 text-white text-sm px-4 py-2 rounded font-medium">
            + 新增查詢
          </button>
        )}
      </div>

      <div className="p-5">
        {tab === 'dashboard' && <Dashboard entries={entries} onOpen={openEdit} />}
        {tab === 'all' && <AllEntries entries={entries} onOpen={openEdit} onDelete={remove} canDelete={isAdmin} />}
        {tab === 'referred' && <ReferredList entries={entries} onUpdateCode={updateCode} onUpdateSubStatus={updateSubStatus} onOpen={openEdit} readOnly={isViewer} />}
        {tab === 'stats' && <StatsPanel entries={entries} />}
        {tab === 'import' && !isViewer && <ImportPanel entries={entries} colleagues={colleagues} db={window.FB.db} onAddColleague={addColleague} />}
        {tab === 'accounts' && isAdmin && <AccountsPanel db={window.FB.db} />}
      </div>

      {showModal && (
        <EntryModal
          initial={modalEntry}
          colleagues={colleagues}
          entries={entries}
          readOnly={isViewer}
          onClose={()=>setShowModal(false)}
          onSave={save}
          onAddColleague={addColleague}
        />
      )}
    </div>
  );
}

// ---------- Root ----------
function Root() {
  const [ready, setReady] = useState(!!window.FB);
  const [user, setUser] = useState(null);
  const [role, setRole] = useState(null);
  const [displayName, setDisplayName] = useState('');
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    if (window.FB) { setReady(true); return; }
    const handler = () => setReady(true);
    window.addEventListener('fbready', handler);
    return () => window.removeEventListener('fbready', handler);
  }, []);

  useEffect(() => {
    if (!ready) return;
    const unsub = window.FB.onAuthStateChanged(window.FB.auth, async (u) => {
      setUser(u);
      if (u) {
        try {
          const { db, doc, getDoc } = window.FB;
          const snap = await getDoc(doc(db, 'users', u.uid));
          if (snap.exists()) {
            setRole(snap.data().role || 'viewer');
            setDisplayName(snap.data().name || '');
          } else {
            setRole('viewer');
            setDisplayName('');
          }
        } catch (e) {
          setRole('viewer');
          setDisplayName('');
        }
      } else {
        setRole(null);
        setDisplayName('');
      }
      setChecking(false);
    });
    return unsub;
  }, [ready]);

  if (!ready || checking) {
    return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#8A8578',fontSize:14}}>載入緊…</div>;
  }
  if (!user) return <Login />;
  return <MainApp user={user} role={role} displayName={displayName} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
